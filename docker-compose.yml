services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD em .env.production}
      MYSQL_DATABASE: ${DB_NAME:-algugest}
      MYSQL_USER: ${DB_USER:-algugest}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD em .env.production}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - "3306"

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Ficheiros legados (content.json/analytics.json): usados só na 1.ª importação
      - ./data:/app/data
      # Imagens/vídeos enviados pelo admin
      - ./public/imagens/uploads:/app/public/imagens/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Vêm do .env.production (via --env-file). Default = domínio de produção.
      SITE_ADDRESS: ${SITE_ADDRESS:-algugest.ao, www.algugest.ao}
      CADDY_TLS: ${CADDY_TLS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
